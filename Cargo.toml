[package]
name = "herdr-nav-preview"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "A tmux-style navigator with live preview for herdr sessions"
license = "Apache-2.0"
repository = "https://github.com/ryutaro-asada/herdr-nav-with-preview"
readme = "README.md"

[[bin]]
name = "herdr-nav-preview"
path = "src/main.rs"

[dependencies]
ratatui = "=0.29.0"
crossterm = "=0.28.1"
serde = { version = "=1.0.210", features = ["derive"] }
serde_json = "=1.0.128"
anyhow = "=1.0.89"
unicode-width = "=0.1.14"
ansi-to-tui = "=7.0.0"

[profile.release]
strip = true
lto = true
