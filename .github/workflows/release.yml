name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
          # Cross-built on the arm64 macOS runner. The dedicated Intel runner
          # (macos-13) is often stuck queued for a long time; macos-14 is
          # readily available and Apple's toolchain cross-compiles x86_64 fine.
          - target: x86_64-apple-darwin
            os: macos-14
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install cross linker (linux arm64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
      - run: cargo build --release --target ${{ matrix.target }}
      - name: Stage asset (unix)
        if: matrix.os != 'windows-latest'
        run: cp target/${{ matrix.target }}/release/herdr-nav-preview herdr-nav-preview-${{ matrix.target }}
      - name: Stage asset (windows)
        if: matrix.os == 'windows-latest'
        run: cp target/${{ matrix.target }}/release/herdr-nav-preview.exe herdr-nav-preview-${{ matrix.target }}.exe
      - uses: softprops/action-gh-release@v2
        with:
          files: herdr-nav-preview-${{ matrix.target }}*
