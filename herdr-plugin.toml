id = "ryutaroasada.nav-with-preview"
name = "Nav with Preview"
version = "0.1.0"
min_herdr_version = "0.7.0"
description = "A tmux Ctrl+b w style navigator with a live pane preview."
platforms = ["linux", "macos", "windows"]

# Built on `herdr plugin install`. Local `plugin link` does not run build
# commands, so build the binary yourself with `cargo build --release`.
[[build]]
command = ["cargo", "build", "--release"]

# The overlay entrypoint. Opens a temporary zoomed overlay over the active pane
# and restores the previous focus/zoom when it closes.
[[panes]]
id = "nav"
title = "Nav with Preview"
placement = "overlay"
command = ["./target/release/herdr-nav-preview"]
