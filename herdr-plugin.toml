id = "ryutaroasada.nav-with-preview"
name = "Nav with Preview"
version = "0.6.0"
min_herdr_version = "0.7.0"
description = "A tmux Ctrl+b w style navigator with a live pane preview."
platforms = ["linux", "macos", "windows"]

# Hybrid build on `herdr plugin install`: try to download a prebuilt binary
# (no Rust needed); if that fails (no release asset / offline / no shell tools),
# fall back to a local `cargo build`. Local `plugin link` does not run build
# commands, so build the binary yourself first when developing.
[[build]]
command = ["sh", "-c", "sh scripts/install-binary.sh || cargo build --release"]
platforms = ["linux", "macos"]

[[build]]
command = ["cmd", "/C", "bash scripts/install-binary.sh || cargo build --release"]
platforms = ["windows"]

# The navigator entrypoint. `popup` opens a session-modal terminal that does
# NOT change the tab layout: it is not a herdr pane, carries no HERDR_PANE_ID,
# and leaves no stray pane behind when it closes. This avoids the overlay being
# added as an extra pane in the active tab (and the focus/duplication issues
# that come with closing panes while it is open).
[[panes]]
id = "nav"
title = "Nav with Preview"
placement = "popup"
width = "80%"
height = "80%"
command = ["./target/release/herdr-nav-preview"]
